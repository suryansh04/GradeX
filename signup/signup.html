<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up · GradeX</title>
    <link rel="icon" type="image/png" href="../images/favicon-1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
    <script src="https://kit.fontawesome.com/a4b6467969.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <main class="auth">
      <div class="auth-art" aria-hidden="true"></div>
      <div class="auth-panel">
        <form class="auth-form" id="signup-form" novalidate>
          <a class="logo" href="../login/login.html"><span>Grade</span>X</a>
          <div>
            <h1 class="auth-title">Hello 👋</h1>
            <p class="auth-subtitle">Create your account to get started</p>
          </div>

          <p class="form-error" id="form-error" role="alert" hidden></p>

          <div class="field">
            <label for="name">Name</label>
            <input class="input" type="text" id="name" name="name" placeholder="Enter your name" autocomplete="name" required />
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input class="input" type="password" id="password" name="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required aria-describedby="strength-label" />
              <button class="icon-btn" type="button" aria-label="Show password" aria-pressed="false">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
            <div class="strength-meter" id="strength-meter" data-level="0" aria-hidden="true">
              <span></span><span></span><span></span><span></span>
            </div>
            <p class="field-hint" id="strength-label" aria-live="polite"></p>
          </div>

          <fieldset class="role-options">
            <legend class="visually-hidden">I am a</legend>
            <label class="role-option"><input type="radio" name="role" value="teacher" />Teacher</label>
            <label class="role-option"><input type="radio" name="role" value="student" />Student</label>
          </fieldset>

          <button class="btn btn-primary btn-block" type="submit">Signup</button>
          <p class="auth-switch">Already have an account? <a href="../login/login.html">Login</a></p>
        </form>
      </div>
    </main>
    <script type="module" src="./signup.js"></script>
  </body>
</html>
