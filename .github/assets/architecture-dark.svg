<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d8fff"/>
    </marker>
  </defs>
  <rect width="1280" height="600" fill="#0f1320"/>
  <rect x="40" y="90" width="300" height="150" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="62" y="128" font-size="19" font-weight="600" fill="#e8ebf5">Teacher portal</text><text x="62" y="162" font-size="15" fill="#9aa3b8" xml:space="preserve">Create an exam: questions,</text><text x="62" y="188" font-size="15" fill="#9aa3b8" xml:space="preserve">marks and images</text><text x="62" y="214" font-size="15" fill="#9aa3b8" xml:space="preserve">Answer sheet PDF read by pdf.js</text><rect x="40" y="330" width="300" height="170" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="62" y="368" font-size="19" font-weight="600" fill="#e8ebf5">Student portal</text><text x="62" y="402" font-size="15" fill="#9aa3b8" xml:space="preserve">Pick an exam and answer</text><text x="62" y="428" font-size="15" fill="#9aa3b8" xml:space="preserve">one question at a time</text><text x="62" y="454" font-size="15" fill="#9aa3b8" xml:space="preserve">Read graded results</text><text x="62" y="480" font-size="15" fill="#9aa3b8" xml:space="preserve">question by question</text><rect x="440" y="40" width="400" height="520" rx="22" fill="none" stroke="#6d8fff" stroke-width="1.5" stroke-dasharray="7 7" opacity="0.7"/><text x="464" y="74" font-size="15" font-weight="600" fill="#6d8fff">FastAPI backend</text><rect x="470" y="95" width="340" height="195" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="492" y="133" font-size="19" font-weight="600" fill="#e8ebf5">API routes</text><text x="492" y="167" font-size="15" fill="#9aa3b8" xml:space="preserve"><tspan fill="#6d8fff">/auth</tspan>  sign up, log in</text><text x="492" y="193" font-size="15" fill="#9aa3b8" xml:space="preserve"><tspan fill="#6d8fff">/exams</tspan>  create, list, open</text><text x="492" y="219" font-size="15" fill="#9aa3b8" xml:space="preserve"><tspan fill="#6d8fff">/uploads/images</tspan>  question images</text><text x="492" y="245" font-size="15" fill="#9aa3b8" xml:space="preserve"><tspan fill="#6d8fff">/submissions</tspan>  submit, results</text><rect x="470" y="345" width="340" height="190" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="492" y="383" font-size="19" font-weight="600" fill="#e8ebf5">Background grader</text><text x="492" y="417" font-size="15" fill="#9aa3b8" xml:space="preserve">9 similarity measures give a</text><text x="492" y="443" font-size="15" fill="#9aa3b8" xml:space="preserve">provisional grade</text><text x="492" y="469" font-size="15" fill="#9aa3b8" xml:space="preserve">Plagiarism check on each answer</text><text x="492" y="495" font-size="15" fill="#9aa3b8" xml:space="preserve">Claude writes the feedback</text><rect x="960" y="90" width="280" height="130" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="982" y="128" font-size="19" font-weight="600" fill="#e8ebf5">PostgreSQL</text><text x="982" y="162" font-size="15" fill="#9aa3b8" xml:space="preserve">users · exams · submissions</text><text x="982" y="188" font-size="15" fill="#9aa3b8" xml:space="preserve">migrations with Alembic</text><rect x="960" y="250" width="280" height="100" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="982" y="288" font-size="19" font-weight="600" fill="#e8ebf5">Local disk</text><text x="982" y="322" font-size="15" fill="#9aa3b8" xml:space="preserve">/media  question images</text><rect x="960" y="390" width="280" height="145" rx="16" fill="#171c2b" stroke="#2a3147" stroke-width="1.5"/><text x="982" y="428" font-size="19" font-weight="600" fill="#6d8fff">Claude Opus 5.5</text><text x="982" y="462" font-size="15" fill="#9aa3b8" xml:space="preserve">grade · answer status</text><text x="982" y="488" font-size="15" fill="#9aa3b8" xml:space="preserve">feedback · correct answer</text><text x="982" y="514" font-size="15" fill="#9aa3b8" xml:space="preserve">common mistake · learning tip</text><path d="M340,165 L470,165" fill="none" stroke="#6d8fff" stroke-width="2" marker-end="url(#head)"/><text x="405" y="155" text-anchor="middle" font-size="13" fill="#9aa3b8">JSON + token</text><path d="M340,415 L405,415 L405,250 L470,250" fill="none" stroke="#6d8fff" stroke-width="2" marker-end="url(#head)"/><text x="395" y="318" text-anchor="end" font-size="13" fill="#9aa3b8">answers, results</text><path d="M640,290 L640,345" fill="none" stroke="#6d8fff" stroke-width="2" marker-end="url(#head)"/><text x="652" y="323" text-anchor="start" font-size="13" fill="#9aa3b8">after each submission</text><path d="M840,155 L960,155" fill="none" stroke="#6d8fff" stroke-width="2" marker-end="url(#head)"/><text x="900" y="145" text-anchor="middle" font-size="13" fill="#9aa3b8">SQLAlchemy</text><path d="M840,300 L960,300" fill="none" stroke="#6d8fff" stroke-width="2" marker-end="url(#head)"/><text x="900" y="290" text-anchor="middle" font-size="13" fill="#9aa3b8">images</text><path d="M810,465 L960,465" fill="none" stroke="#6d8fff" stroke-width="2" marker-end="url(#head)"/><text x="885" y="455" text-anchor="middle" font-size="13" fill="#9aa3b8">Anthropic SDK</text>
</svg>
